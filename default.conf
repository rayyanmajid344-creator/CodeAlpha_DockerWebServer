server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fill in the live container details on the page
    ssi on;

    # Always serve fresh details instead of a cached copy
    add_header Cache-Control "no-store";

    # Health check endpoint used by Docker
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP"}';
    }
}